name: Deploy TradeX API to OCI instance

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "INFO.txt"
      - "TODO.txt"
  workflow_dispatch:
    inputs:
      service:
        description: 'Specific service to rebuild and restart (leave "all" for full stack)'
        required: false
        default: "all"
        type: string
      no_cache:
        description: "Build images without cache (--no-cache)"
        required: false
        default: false
        type: boolean
      manage_ssl:
        description: "Request or renew SSL certificates via Certbot"
        required: false
        default: false
        type: boolean

concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Oracle Cloud VM
    runs-on: ubuntu-latest
    environment: TradeX API Production

    steps:
      - name: Checkout Code (for reference / commit info)
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_KEY }}
          HOST: ${{ secrets.OCI_HOST }}
          PORT: ${{ vars.OCI_PORT || secrets.OCI_PORT || '22' }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$HOST" ]; then
            echo "::error::Secrets OCI_SSH_KEY and OCI_HOST must be configured in GitHub Secrets."
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Scan and register host keys
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Sync .env File (if configured in GitHub Secrets)
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
          HOST: ${{ secrets.OCI_HOST }}
          USERNAME: ${{ vars.OCI_USERNAME || secrets.OCI_USERNAME || 'ubuntu' }}
          PORT: ${{ vars.OCI_PORT || secrets.OCI_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.OCI_DEPLOY_PATH || secrets.OCI_DEPLOY_PATH || '~/trade-x-api' }}
        run: |
          if [ -n "$PROD_ENV_FILE" ]; then
            echo "==> Syncing .env to remote server..."
            echo "$PROD_ENV_FILE" | ssh -o ServerAliveInterval=30 -p "$PORT" "$USERNAME@$HOST" \
              "eval TARGET_DIR=\"$DEPLOY_PATH\"; mkdir -p \"\$TARGET_DIR\" && cat > \"\$TARGET_DIR/.env\" && chmod 600 \"\$TARGET_DIR/.env\""
            echo "==> Successfully synced .env from GitHub Secrets."
          else
            echo "==> No PROD_ENV_FILE secret provided, skipping .env sync."
          fi

      - name: Execute Remote Deployment via SSH
        env:
          HOST: ${{ secrets.OCI_HOST }}
          USERNAME: ${{ vars.OCI_USERNAME || secrets.OCI_USERNAME || 'ubuntu' }}
          PORT: ${{ vars.OCI_PORT || secrets.OCI_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.OCI_DEPLOY_PATH || secrets.OCI_DEPLOY_PATH || '~/trade-x-api' }}
          TARGET_SERVICE: ${{ inputs.service || 'all' }}
          NO_CACHE: ${{ inputs.no_cache || false }}
          MANAGE_SSL: ${{ inputs.manage_ssl || false }}
          SSL_EMAIL: ${{ vars.SSL_EMAIL || secrets.SSL_EMAIL || 'shubhamprakash444@gmail.com' }}
        run: |
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=30 -p "$PORT" "$USERNAME@$HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' TARGET_SERVICE='$TARGET_SERVICE' NO_CACHE='$NO_CACHE' MANAGE_SSL='$MANAGE_SSL' SSL_EMAIL='$SSL_EMAIL' bash -s" << 'EOF'
            set -eo pipefail

            # Expand tilde if present
            eval DEPLOY_DIR="$DEPLOY_PATH"
            echo "==> Deploy directory: ${DEPLOY_DIR}"

            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "::error::Directory ${DEPLOY_DIR} does not exist on target host. Clone the repository first."
              exit 1
            fi

            cd "$DEPLOY_DIR"

            echo "==> Fetching latest changes from origin/main..."
            git fetch origin main
            git reset --hard origin/main

            # Verify .env exists
            if [ ! -f ".env" ]; then
              echo "::error::No .env file found in ${DEPLOY_DIR}! Please create it on the server or set the PROD_ENV_FILE GitHub Secret."
              exit 1
            fi

            # Check docker and compose availability
            if ! command -v docker &> /dev/null; then
              echo "::error::Docker is not installed or not in PATH."
              exit 1
            fi

            echo "==> Verifying docker compose configuration..."
            docker compose -f docker-compose-prod.yml config > /dev/null

            BUILD_FLAGS=""
            if [ "$NO_CACHE" = "true" ]; then
              BUILD_FLAGS="--no-cache"
            fi

            if [ "$TARGET_SERVICE" != "all" ] && [ -n "$TARGET_SERVICE" ]; then
              echo "==> Rebuilding and restarting single service: ${TARGET_SERVICE}..."
              docker compose -f docker-compose-prod.yml build $BUILD_FLAGS "$TARGET_SERVICE"
              docker compose -f docker-compose-prod.yml up -d --no-deps "$TARGET_SERVICE"
            else
              echo "==> Deploying all services using docker-compose-prod.yml..."
              docker compose -f docker-compose-prod.yml up -d --build $BUILD_FLAGS --remove-orphans
            fi

            # ========================================================
            # SSL Certificate Management (Certbot)
            # ========================================================
            CERT_PATH="/etc/letsencrypt/live/api.tradex.shubhamprakash681.in/fullchain.pem"
            CERT_EXISTS=$(docker compose -f docker-compose-prod.yml run --rm --entrypoint "" certbot sh -c "[ -f '$CERT_PATH' ] && echo 'yes' || echo 'no'" 2>/dev/null || echo "no")

            if [ "$CERT_EXISTS" != "yes" ] || [ "$MANAGE_SSL" = "true" ]; then
              echo "==> Certificate fullchain.pem not found or manage_ssl requested. Requesting SSL certificate with Certbot..."
              docker compose -f docker-compose-prod.yml run --rm certbot certonly \
                --webroot \
                --webroot-path=/var/www/certbot \
                --email "${SSL_EMAIL:-shubhamprakash444@gmail.com}" \
                --agree-tos \
                --no-eff-email \
                -d api.tradex.shubhamprakash681.in \
                -d www.api.tradex.shubhamprakash681.in

              echo "==> Reloading Nginx to switch to HTTPS configuration..."
              docker compose -f docker-compose-prod.yml up -d --force-recreate nginx
            else
              echo "==> Existing SSL certificate found. Checking renewal status..."
              docker compose -f docker-compose-prod.yml run --rm certbot renew || true
            fi

            echo "==> Cleaning up dangling images..."
            docker image prune -f || true

            echo "==> Checking container status..."
            docker compose -f docker-compose-prod.yml ps

            echo "==> Deployment completed successfully!"
          EOF
