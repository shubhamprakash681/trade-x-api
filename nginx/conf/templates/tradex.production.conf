upstream api_gateway {
    server api-gateway:8080;
    keepalive 32;
}

# =============================================================
# HTTP
# =============================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name
        api.tradex.shubhamprakash681.in
        www.api.tradex.shubhamprakash681.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location / {
        return 301 https://api.tradex.shubhamprakash681.in$request_uri;
    }
}

# =============================================================
# HTTPS www API alias
# =============================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.api.tradex.shubhamprakash681.in;

    ssl_certificate
        /etc/letsencrypt/live/api.tradex.shubhamprakash681.in/fullchain.pem;

    ssl_certificate_key
        /etc/letsencrypt/live/api.tradex.shubhamprakash681.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Do not redirect browser API/WebSocket requests here. Browsers reject a
    # redirect during a CORS preflight and a WebSocket upgrade. Keep this alias
    # functional for existing frontend deployments while api.* remains the
    # preferred canonical base URL.
    location / {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# =============================================================
# HTTPS canonical API
# =============================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name api.tradex.shubhamprakash681.in;

    ssl_certificate
        /etc/letsencrypt/live/api.tradex.shubhamprakash681.in/fullchain.pem;

    ssl_certificate_key
        /etc/letsencrypt/live/api.tradex.shubhamprakash681.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location / {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
