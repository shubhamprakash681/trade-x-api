name: tradex

x-service-environment: &service-environment
  SPRING_PROFILES_ACTIVE: prod
  SPRING_CONFIG_IMPORT: configserver:http://config-server:${CONFIG_SERVER_PORT:-8888}
  SPRING_CLOUD_CONFIG_FAIL_FAST: "true"
  CONFIG_SERVER_URL: http://config-server:${CONFIG_SERVER_PORT:-8888}
  EUREKA_SERVER_URL: http://discovery-server:${EUREKA_SERVER_PORT:-8761}/eureka/
  POSTGRES_USER: ${POSTGRES_USER:-tradex}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:-tradex}
  TRADEX_JWT_SECRET: ${TRADEX_JWT_SECRET:?Set TRADEX_JWT_SECRET in .env}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
  TRADEX_PRICE_TOPIC: ${TRADEX_PRICE_TOPIC:-tradex.market.prices}
  TRADEX_MARKET_HISTORY_YEARS: ${TRADEX_MARKET_HISTORY_YEARS:-10}
  TRADEX_MARKET_HISTORY_INTERVAL: ${TRADEX_MARKET_HISTORY_INTERVAL:-DAILY}
  TRADEX_STARTING_CASH: ${TRADEX_STARTING_CASH:-1000000.00}
  TRADEX_PRICE_GENERATION_INTERVAL_MS: ${TRADEX_PRICE_GENERATION_INTERVAL_MS:-2000}
  TRADEX_PRICE_HISTORY_LIMIT: ${TRADEX_PRICE_HISTORY_LIMIT:-500}
  TRADEX_PRICE_SYMBOLS: ${TRADEX_PRICE_SYMBOLS:-RELIANCE,TCS,INFY,HDFCBANK,ICICIBANK,SBIN,ITC,LT,AXISBANK,BHARTIARTL,MARUTI,TITAN,ASIANPAINT,NIFTYBEES,BANKBEES}
  TRADEX_WATCHLIST_CACHE_TTL_MINUTES: ${TRADEX_WATCHLIST_CACHE_TTL_MINUTES:-10}
  TRADEX_NOTIFICATION_LIMIT: ${TRADEX_NOTIFICATION_LIMIT:-100}

x-java-service: &java-service
  restart: unless-stopped
  pull_policy: build
  networks:
    - tradex
  environment:
    <<: *service-environment
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:$${SERVER_PORT}/actuator/health/readiness | grep -q 'UP'"]
    interval: 15s
    timeout: 5s
    retries: 12
    start_period: 45s

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tradex}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - tradex
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - tradex
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:4.0.5-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - tradex
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - tradex
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  config-server:
    <<: *java-service
    build:
      context: .
      args:
        SERVICE: config-server
    environment:
      SPRING_PROFILES_ACTIVE: prod,native
      SERVER_PORT: ${CONFIG_SERVER_PORT:-8888}

  discovery-server:
    <<: *java-service
    build:
      context: .
      args:
        SERVICE: discovery-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: ${EUREKA_SERVER_PORT:-8761}

  api-gateway:
    <<: *java-service
    build:
      context: .
      args:
        SERVICE: api-gateway
    environment:
      <<: *service-environment
      SERVER_PORT: ${API_GATEWAY_PORT:-8080}
    networks:
      tradex:
      edge:
        aliases:
          - tradex-gateway
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  auth-service:
    <<: *java-service
    build:
      context: .
      args:
        SERVICE: auth-service
    environment:
      <<: *service-environment
      SERVER_PORT: ${AUTH_SERVICE_PORT:-8081}
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  market-service:
    <<: *java-service
    build:
      context: .
      args:
        SERVICE: market-service
    environment:
      <<: *service-environment
      SERVER_PORT: ${MARKET_SERVICE_PORT:-8082}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  portfolio-service:
    <<: *java-service
    build:
      context: .
      args:
        SERVICE: portfolio-service
    environment:
      <<: *service-environment
      SERVER_PORT: ${PORTFOLIO_SERVICE_PORT:-8083}
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  price-stream-service:
    <<: *java-service
    build:
      context: .
      args:
        SERVICE: price-stream-service
    environment:
      <<: *service-environment
      SERVER_PORT: ${PRICE_STREAM_SERVICE_PORT:-8084}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  notification-service:
    <<: *java-service
    build:
      context: .
      args:
        SERVICE: notification-service
    environment:
      <<: *service-environment
      SERVER_PORT: ${NOTIFICATION_SERVICE_PORT:-8085}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

networks:
  tradex:
    driver: bridge
  edge:
    name: ${SHARED_PROXY_NETWORK:-shared-proxy}
    external: true

volumes:
  postgres-data:
    name: tradex_postgres_volume_prod
  redis-data:
    name: tradex_redis_volume_prod
  kafka-data:
    name: tradex_kafka_volume_prod
  rabbitmq-data:
    name: tradex_config_rabbitmq_volume_prod
