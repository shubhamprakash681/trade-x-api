server:
  port: ${API_GATEWAY_PORT:8080}
  shutdown: graceful

spring:
  cloud:
    gateway:
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:10s}

management:
  endpoint:
    gateway:
      access: read-only

springdoc:
  swagger-ui:
    disable-swagger-default-url: true
