server:
  port: ${PORTFOLIO_SERVICE_PORT:8083}
  shutdown: graceful

spring:
  datasource:
    url: ${PORTFOLIO_DB_URL:jdbc:postgresql://postgres:5432/${POSTGRES_DB:tradex}}
    username: ${PORTFOLIO_DB_USERNAME:${POSTGRES_USER}}
    password: ${PORTFOLIO_DB_PASSWORD:${POSTGRES_PASSWORD}}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

springdoc:
  swagger-ui:
    enabled: false
